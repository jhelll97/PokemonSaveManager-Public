android.useAndroidX=true
android.enableJetifier=true

# Kotlin compilation of the large application source needs a 4-GiB compiler heap.
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseG1GC

# Release packaging exhausted Gradle's 2-GiB heap. Raise it to 3 GiB and limit
# Gradle to one worker so peak memory remains suitable for a standard runner.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
org.gradle.workers.max=1

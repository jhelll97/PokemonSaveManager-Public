android.useAndroidX=true
android.enableJetifier=true

# Use one JVM for Kotlin compilation and release packaging on the free standard runner.
kotlin.compiler.execution.strategy=in-process

# Release packaging exhausted a 3-GiB Gradle heap. Raise the shared JVM heap to 4 GiB
# and limit Gradle to one worker to keep peak memory suitable for a standard runner.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
org.gradle.workers.max=1

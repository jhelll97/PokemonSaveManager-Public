android.useAndroidX=true
android.enableJetifier=true

# Use one JVM for Kotlin compilation and release packaging on the free standard runner.
kotlin.compiler.execution.strategy=in-process

# Kotlin source compilation exhausted 4, 6, and 10-GiB Gradle heaps in runs 41887862756,
# 41895098394, and 41903596068. Use 13 GiB on the public 16-GiB runner and retain one worker.
org.gradle.jvmargs=-Xmx13312m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
org.gradle.workers.max=1

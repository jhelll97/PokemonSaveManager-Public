android.useAndroidX=true
android.enableJetifier=true

# Use one JVM for Kotlin compilation and release packaging on the free standard runner.
kotlin.compiler.execution.strategy=in-process

# Kotlin source compilation exhausted 4-GiB and 6-GiB Gradle heaps in runs 41887862756 and
# 41895098394. Use 10 GiB on the public repository's 16-GiB runner and retain one worker.
org.gradle.jvmargs=-Xmx10240m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
org.gradle.workers.max=1

name: Android build

on:
  push:
    branches:
      - pse-phone-auto-v2-test
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: "Build and upload a signed APK (requires signing secrets)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  debug:
    name: Compile and lint source without APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Keep compiler state out of lint's heap; each --no-daemon invocation exits.
      # In-process compilation avoids retaining a separate 4-GiB Kotlin daemon.
      - name: Compile sources without APK packaging
        run: >-
          gradle :app:compileDebugSources --no-daemon --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"

      # Exact run 41649172635 exhausted the shared 3-GiB heap during lint analysis.
      - name: Lint sources in a fresh heap
        run: >-
          gradle :app:lintDebug --no-daemon --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Didea.max.intellisense.filesize=4096"

  signed-release:
    name: Build signed APK on request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require signing secrets
        shell: bash
        env:
          PSE_KEYSTORE_BASE64: ${{ secrets.PSE_KEYSTORE_BASE64 }}
          PSE_KEYSTORE_PASSWORD: ${{ secrets.PSE_KEYSTORE_PASSWORD }}
          PSE_KEY_ALIAS: ${{ secrets.PSE_KEY_ALIAS }}
          PSE_KEY_PASSWORD: ${{ secrets.PSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PSE_KEYSTORE_BASE64"
          test -n "$PSE_KEYSTORE_PASSWORD"
          test -n "$PSE_KEY_ALIAS"
          test -n "$PSE_KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key to runner temp
        shell: bash
        env:
          PSE_KEYSTORE_BASE64: ${{ secrets.PSE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/pse-release.jks"
          printf '%s' "$PSE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "PSE_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        shell: bash
        env:
          PSE_KEYSTORE_PASSWORD: ${{ secrets.PSE_KEYSTORE_PASSWORD }}
          PSE_KEY_ALIAS: ${{ secrets.PSE_KEY_ALIAS }}
          PSE_KEY_PASSWORD: ${{ secrets.PSE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --max-workers=2

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PokemonSaveManager-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  slack-result:
    name: Send one V4 validation event
    needs: [debug, signed-release]
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'pse-phone-auto-v2-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post exact validation event to Slack
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DEBUG_RESULT: ${{ needs.debug.result }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_BRANCH: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_RUN_ID: ${{ github.run_id }}
          EVENT_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_WORKFLOW: ${{ github.workflow }}
          EVENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$SLACK_BOT_TOKEN" || { echo "Missing SLACK_BOT_TOKEN repository secret"; exit 1; }
          if [ "$DEBUG_RESULT" = "success" ]; then
            result=PSE_BUILD_SUCCESS
          else
            result=PSE_BUILD_FAILURE
          fi
          export RESULT="$result"
          payload="$(RESULT="$result" python3 - <<'PY'
          import json, os
          text = (
              f"{os.environ['RESULT']} repository={os.environ['EVENT_REPOSITORY']} "
              f"branch={os.environ['EVENT_BRANCH']} commit={os.environ['EVENT_SHA']} "
              f"run_id={os.environ['EVENT_RUN_ID']} run_attempt={os.environ['EVENT_ATTEMPT']} "
              f"event={os.environ['EVENT_NAME']} workflow={os.environ['EVENT_WORKFLOW']} "
              f"conclusion={os.environ['DEBUG_RESULT']} run_url={os.environ['EVENT_RUN_URL']} "
              f"<@U0C27Q6R8CT> verify this completed build event."
          )
          print(json.dumps({"channel": "C0C3C2QDMJL", "text": text}))
          PY
          )"
          response="$(curl --connect-timeout 10 --max-time 20 --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$payload" \
            https://slack.com/api/chat.postMessage)"
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") else 1)'
          echo "Posted one PSE validation event."

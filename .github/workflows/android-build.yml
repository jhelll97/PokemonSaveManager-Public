name: Android build

on:
  push:
    branches:
      - pse-phone-auto-v2-test
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: "Build and upload a signed APK (requires signing secrets)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Compile unsigned debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compile Android app
        run: gradle :app:assembleDebug --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PokemonSaveManager-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  signed-release:
    name: Build signed APK on request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require signing secrets
        shell: bash
        env:
          PSE_KEYSTORE_BASE64: ${{ secrets.PSE_KEYSTORE_BASE64 }}
          PSE_KEYSTORE_PASSWORD: ${{ secrets.PSE_KEYSTORE_PASSWORD }}
          PSE_KEY_ALIAS: ${{ secrets.PSE_KEY_ALIAS }}
          PSE_KEY_PASSWORD: ${{ secrets.PSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PSE_KEYSTORE_BASE64"
          test -n "$PSE_KEYSTORE_PASSWORD"
          test -n "$PSE_KEY_ALIAS"
          test -n "$PSE_KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key to runner temp
        shell: bash
        env:
          PSE_KEYSTORE_BASE64: ${{ secrets.PSE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/pse-release.jks"
          printf '%s' "$PSE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "PSE_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        shell: bash
        env:
          PSE_KEYSTORE_PASSWORD: ${{ secrets.PSE_KEYSTORE_PASSWORD }}
          PSE_KEY_ALIAS: ${{ secrets.PSE_KEY_ALIAS }}
          PSE_KEY_PASSWORD: ${{ secrets.PSE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --max-workers=2

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PokemonSaveManager-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

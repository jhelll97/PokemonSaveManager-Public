plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.pokemonsavemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.pokemonsavemanager'
        minSdk 26
        targetSdk 35
        versionCode 214
        versionName '0.54.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('PSE_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('PSE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PSE_KEY_ALIAS')
                keyPassword System.getenv('PSE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
